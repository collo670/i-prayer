  <style>
        /* Custom styles for dark mode and font */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a; /* Default dark background */
            color: #e0e0e0; /* Default light text */
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light mode styles */
        body.light-mode {
            background-color: #2a2a2a; /* Light background */
            color: black; /* Dark text */
        }

        .dark-mode-toggle {
            background-color: #333;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin: auto;
            font-size: 0.8rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            border: none; /* Remove default button border */
        }

        .dark-mode-toggle:hover {
            background-color: #555;
        }

        body.light-mode .dark-mode-toggle {
            background-color: #ccc;
            color: #333;
        }

        body.light-mode .dark-mode-toggle:hover {
            background-color: #aaa;
        }

        .card {
            background-color: #2a2a2a; /* Default darker card background */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        body.light-mode .card {
            background-color: #ffffff; /* Light card background */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card-highlighted {
            background-color: #4a4a4a; /* Slightly lighter for highlighted card in dark mode */
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        body.light-mode .card-highlighted {
            background-color: #e0e0e0; /* Highlighted card in light mode */
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }

        .icon-bg {
            background-color: #ffc107; /* Yellow icon background */
            color: #1a1a1a; /* Dark text for icons */
        }

        .bottom-nav {
            background-color: #2a2a2a; /* Default darker background for nav */
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.3);
        }

        body.light-mode .bottom-nav {
            background-color: #ffffff; /* Light background for nav */
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }

        .bottom-nav-item {
            color: #a0a0a0; /* Default greyish text for inactive nav items */
        }

        body.light-mode .bottom-nav-item {
            color: #666666; /* Darker grey for inactive nav items in light mode */
        }

        .bottom-nav-item.active {
            color: #ffc107; /* Yellow for active nav item */
        }

        /* SVG icon styling */
        .svg-icon {
            fill: currentColor; /* Use parent's text color */
            width: 24px;
            height: 24px;
        }

        /* Styling for the new links within the grid */
        .grid-link-item {
            display: block; /* Make the anchor tag fill the div */
            padding: 8px 12px; /* Add padding to the link itself */
            border-radius: 0.5rem; /* rounded-lg */
            background-color: #4a4a4a; /* bg-gray-700 */
            color: #e0e0e0; /* text-gray-300 */
            text-decoration: none; /* Remove underline */
            transition: background-color 0.2s ease;
        }

        .grid-link-item:hover {
            background-color: #ffc107; /* Slightly lighter on hover */
            color: black; /* Change text color on hover */
        }

        body.light-mode .grid-link-item {
            background-color: #e9e9e9; /* Light mode background */
            color: #333;
        }

        body.light-mode .grid-link-item:hover {
            background-color: #d9d9d9;
        }

        .grid-link-item.highlighted {
            background-color: #ffc107; /* Yellow for highlighted */
            color: #1a1a1a; /* Dark text for highlighted */
            font-weight: bold;
        }

        /* Styling for the new h1 heading */
        .ipray-heading {
            color: #ffc107; /* Yellow color for the heading */
            text-align: center;
            font-family: 'times new roman';
            font-size: 2.5rem; /* Larger font size */
            font-weight: bold;
            margin-top: 2rem; /* Space from the top */
            margin-bottom: 1rem; /* Space before the next element */
            padding-top: 20px; /* Adjust for fixed header */
        }

        .ipray-head {
            color: #ffc107; /* Yellow color for the heading */
            text-align: center;
            font-family: 'verdana';
            font-size: 1rem; /* Larger font size */
            font-weight:500;
            margin-top: 0.1rem; /* Space from the top */
            margin-bottom: 0.1rem; /* Space before the next element */
            padding-top: 20px; /* Adjust for fixed header */
        }

        /* Adjust main content padding to account for the new heading */
        .container {
            padding-top: 1rem; /* Reduced padding as h1 adds its own */
            padding-left: 1rem;  /* Add this */
            padding-right: 1rem; /* Add this */
        }
        @media (min-width: 640px) {
            .container {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }
        @media (min-width: 1024px) {

                padding-right: 4rem;

        }
        .icon-container {
            display: flex;

                margin-top: 1rem;
            }

            .icon-circle {
                width: 74px;
                height: 74px;
                border-radius: 50%;
                border: 4px solid #ffc107; /* Yellow border */
                overflow: hidden;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            }

            .icon-circle img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            @media (min-width: 640px) {
                .icon-circle {
                width: 80px;
                height: 80px;
                }
            }

            @media (min-width: 768px) {
                .icon-circle {

                height: 96px;
                }

            /* Custom styles for liturgical colors */
            .advent { color: #800080; font-weight: bold; }
            .christmas { color: #ffd700; background-color: #4a4a4a; padding: 2px 5px; border-radius: 3px; }
            .lent { color: #800080; font-weight: bold; }
            .easter { color: #ffffff; background-color: #c8102e; padding: 2px 5px; border-radius: 3px; }

            .feast { font-style: italic; color: #4a4a4a; }
            .memorial { color: #4a4a4a; }
            /* Background image with semi-transparent overlay for readability */
            .vintage-background {
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        .vintage-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85); /* Slightly more opaque for better readability */
            z-index: 1;
        }
        .vintage-background > * {

        body.dark-mode .vintage-background {

        body.dark-mode .vintage-background::before {

        body.light-mode .vintage-background {

        }
            body.light-mode .vintage-background::before {
            background: rgba(255,255,255,0.85);
        }
            body.light-mode .vintage-background h1,
            body.light-mode .vintage-background h2,
            body.light-mode .vintage-background h3,
            body.light-mode .vintage-background p,
            body.light-mode .vintage-background span {

        #installPwaBtn {

            background-color: #ccc;
            color: #333;
        }

        body.light-mode #installPwaBtn:hover {
            background-color: #aaa;
        }
    </style>

    <script>
        // Register service worker with relative path for GitHub Pages
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => {
                    console.log('Service worker registered:', reg);
                })
                .catch(err => {
                    console.error('SW registration failed:', err);
                });
        }
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const darkModeToggle = document.getElementById('darkModeToggle');

            // Function to set the theme
            function setTheme(mode) {
                if (mode === 'light') {
                    body.classList.remove('dark-mode');
                    body.classList.add('light-mode');
                    darkModeToggle.textContent = 'Dark Mode';
                    localStorage.setItem('theme', 'light');
                } else {
                    body.classList.remove('light-mode');
                    body.classList.add('dark-mode');
                    darkModeToggle.textContent = 'Light Mode';
                    localStorage.setItem('theme', 'dark');
                }
            }

            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                // Default to dark mode if no preference is saved
                setTheme('dark');
            }

            // Toggle theme on button click
            darkModeToggle.addEventListener('click', () => {
                if (body.classList.contains('dark-mode')) {
                    setTheme('light');
                } else {
                    setTheme('dark');
                }
            });

            // Masifu ya Asubuhi dynamic link by day and week (WEEK 1 starts this week, week changes every Sunday)
            const masifuAsubuhiLink = document.getElementById('masifuAsubuhiLink');
            if (masifuAsubuhiLink) {
                masifuAsubuhiLink.addEventListener('click', function() {
                    const day = new Date().getDay(); // 0=Sunday, 1=Monday, ..., 6=Saturday
                    const dayToPrefix = [
                        'jumapili',   // Sunday
                        'jumatatu',   // Monday
                        'jumanne',    // Tuesday
                        'jumatano',   // Wednesday
                        'alhamisi',   // Thursday
                        'ijumaa',     // Friday
                        'jumamosi'    // Saturday
                    ];
                    // Week sequence: 1 -> 2 -> 3 -> 4 -> 1 ...
                    const weekSequence = [1, 2, 3, 4];
                    // Find the most recent Sunday (including today if today is Sunday)
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const daysSinceSunday = today.getDay(); // 0 if Sunday, 1 if Monday, ..., 6 if Saturday
                    // Reference Sunday is the most recent Sunday (this week is week 1)
                    const referenceSunday = new Date(today);
                    referenceSunday.setDate(today.getDate() - daysSinceSunday);
                    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
                    const weeksSinceReference = Math.floor((today - referenceSunday) / msPerWeek);
                    const weekIndex = weeksSinceReference % weekSequence.length; // 0 is week 1
                    const week = weekSequence[weekIndex];
                    const fileName = `${dayToPrefix[day]}${week}.html`;
                    window.location.href = fileName;
                });
            }

            // Display current week logic (show "Wiki ya : X")
            const weekSequence = [1, 2, 3, 4];
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const daysSinceSunday = today.getDay();
            const referenceSunday = new Date(today);
            referenceSunday.setDate(today.getDate() - daysSinceSunday);
            const msPerWeek = 7 * 24 * 60 * 60 * 1000;
            const weeksSinceReference = Math.floor((today - referenceSunday) / msPerWeek);
            const weekIndex = weeksSinceReference % weekSequence.length;
            const week = weekSequence[weekIndex];
            const currentWeekDiv = document.getElementById('current-week');
            if (currentWeekDiv) {
                currentWeekDiv.textContent = `Wiki ya : ${week}`;
            }

            // Ofisi ya Masomo week logic: show "Dominika ya 17" on Sunday, "Wiki ya 17" on weekdays
            function displayMasomoWeek() {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const daysSinceSunday = today.getDay(); // 0=Sunday, 1=Monday, ..., 6=Saturday
                // Reference Sunday for week 17 (this week is 17, next Sunday is 18, etc.)
                const referenceSunday = new Date(today);
                referenceSunday.setDate(today.getDate() - daysSinceSunday);
                const msPerWeek = 7 * 24 * 60 * 60 * 1000;
                const weeksSinceReference = Math.floor((today - referenceSunday) / msPerWeek);
                const baseWeek = 17; // This week is 17
                const week = baseWeek + weeksSinceReference;
                const masomoWeekDiv = document.getElementById('masomo-week');
                if (masomoWeekDiv) {
                    if (daysSinceSunday === 0) {
                        masomoWeekDiv.textContent = `Dominika ya ${week}`;
                    } else {
                        masomoWeekDiv.textContent = `Wiki ya ${week}`;
                    }
                }
            }
            displayMasomoWeek();

            // Make Ofisi ya Masomo card open mwaka2.html or mwaka3.html depending on the week
            const masomoCard = document.querySelector('a[href="majira.html"]');
            if (masomoCard) {
                masomoCard.addEventListener('click', function(e) {
                    e.preventDefault();
                    // Use the same week logic as displayMasomoWeek
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const daysSinceSunday = today.getDay();
                    const referenceSunday = new Date(today);
                    referenceSunday.setDate(today.getDate() - daysSinceSunday);
                    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
                    const weeksSinceReference = Math.floor((today - referenceSunday) / msPerWeek);
                    const totalMasomoWeeks = 34 - 16 + 1; // 19 weeks (16 to 34 inclusive)
                    const totalMaajilioWeeks = 4;
                    const cycleLength = totalMasomoWeeks + totalMaajilioWeeks; // 23 weeks per cycle
                    const cycleWeek = weeksSinceReference % cycleLength;
                    let week;
                    if (cycleWeek < totalMasomoWeeks) {
                        week = 16 + cycleWeek;
                    } else {
                        // For Maajilio, treat as after week 34
                        week = 35; // Any value > 20 will open mwaka3.html
                    }
                    if (week >= 21) {
                        window.location.href = 'mwaka3.html';
                    } else {
                        window.location.href = 'mwaka2.html';
                    }
                });
            }
        });

           // Install prompt logic
        let deferredPrompt;
        const installBtn = document.getElementById('installPwaBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent the mini-infobar from appearing on mobile
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            // Show the install button
            installBtn.style.display = 'block';
            
            // Optionally, show a toast notification
            showInstallToast();
        });

        // Show a toast notification about PWA installation
        function showInstallToast() {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.backgroundColor = '#333';
            toast.style.color = '#fff';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '8px';
            toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            toast.style.zIndex = '1000';
            toast.style.display = 'flex';
            toast.style.alignItems = 'center';
            toast.style.gap = '12px';
            toast.innerHTML = `
                <span>Install ipray for a better experience</span>
                <button id="toastInstallBtn" style="background:#ffc107;color:#000;border:none;padding:6px 12px;border-radius:4px;font-weight:bold;">
                    Install
                </button>
            `;
            document.body.appendChild(toast);
            
            // Add click handler for the toast button
            document.getElementById('toastInstallBtn').addEventListener('click', () => {
                installPWA();
                toast.remove();
            });
            
            // Auto-dismiss after 10 seconds
            setTimeout(() => {
                toast.remove();
            }, 10000);
        }

        // Handle install button click
        installBtn.addEventListener('click', installPWA);

        async function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User accepted the install prompt');
                    installBtn.style.display = 'none';
                } else {
                    console.log('User dismissed the install prompt');
                }
                deferredPrompt = null;
            }
        }

        // Track successful installation
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            installBtn.style.display = 'none';
            
            // You could show a thank you message or redirect to a welcome page
            showThankYouMessage();
        });

        function showThankYouMessage() {
            const message = document.createElement('div');
            message.style.position = 'fixed';
            message.style.bottom = '20px';
            message.style.left = '50%';
            message.style.transform = 'translateX(-50%)';
            message.style.backgroundColor = '#ffc107';
            message.style.color = '#000';
            message.style.padding = '12px 24px';
            message.style.borderRadius = '8px';
            message.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            message.style.zIndex = '1000';
            message.textContent = 'Thank you for installing ipray!';
            document.body.appendChild(message);
            
            setTimeout(() => {
                message.remove();
            }, 3000);
        }

        // Easter Sunday 2025: April 20
        const easterSunday = new Date(2025, 3, 20); // Months are 0-based in JS

        // Calculate key movable feasts relative to Easter
        const ashWednesday = new Date(easterSunday);
        ashWednesday.setDate(easterSunday.getDate() - 46); // 46 days before Easter
        const palmSunday = new Date(easterSunday);
        palmSunday.setDate(easterSunday.getDate() - 7); // Sunday before Easter
        const goodFriday = new Date(easterSunday);
        goodFriday.setDate(easterSunday.getDate() - 2); // Friday before Easter
        const ascension = new Date(easterSunday);
        ascension.setDate(easterSunday.getDate() + 40); // 40 days after Easter
        const pentecost = new Date(easterSunday);
        pentecost.setDate(easterSunday.getDate() + 50); // 50 days after Easter
        const trinitySunday = new Date(easterSunday);
        trinitySunday.setDate(easterSunday.getDate() + 56); // Sunday after Pentecost
        const corpusChristi = new Date(easterSunday);
        corpusChristi.setDate(easterSunday.getDate() + 60); // Thursday after Trinity

        // First Sunday of Advent 2025: November 30
        const firstAdvent = new Date(2025, 10, 30);

        // Fixed feasts and solemnities
        const fixedFeasts = [
            { date: new Date(2025, 0, 1), name: "Mary, Mother of God", type: "solemnity" },
            { date: new Date(2025, 0, 6), name: "Epiphany", type: "solemnity" },
            { date: new Date(2025, 1, 2), name: "Presentation of the Lord", type: "feast" },
            { date: new Date(2025, 2, 25), name: "Annunciation", type: "solemnity" },
            { date: new Date(2025, 5, 24), name: "Nativity of John the Baptist", type: "solemnity" },
            { date: new Date(2025, 5, 29), name: "Saints Peter and Paul", type: "solemnity" },
            { date: new Date(2025, 7, 15), name: "Assumption of Mary", type: "solemnity" },
            { date: new Date(2025, 10, 1), name: "All Saints", type: "solemnity" },
            { date: new Date(2025, 10, 2), name: "All Souls", type: "memorial" },
            { date: new Date(2025, 11, 8), name: "Immaculate Conception", type: "solemnity" },
            { date: new Date(2025, 11, 25), name: "Christmas", type: "solemnity" },
        ];

        // Movable feasts
        const movableFeasts = [
            { date: ashWednesday, name: "Ash Wednesday", type: "lent" },
            { date: palmSunday, name: "Palm Sunday", type: "lent" },
            { date: goodFriday, name: "Good Friday", type: "lent" },
            { date: easterSunday, name: "Easter Sunday", type: "easter" },
            { date: ascension, name: "Ascension", type: "easter" },
            { date: pentecost, name: "Pentecost", type: "easter" },
            { date: trinitySunday, name: "Trinity Sunday", type: "solemnity" },
            { date: corpusChristi, name: "Corpus Christi", type: "solemnity" },
        ];

        // Combine all feasts
        const allFeasts = [...fixedFeasts, ...movableFeasts];

        // Function to display the current day's liturgical information
        function displayCurrentDay() {
            const now = new Date(); // Current date and time
            const currentDate = new Date(now.getFullYear(), now.getMonth(), now.getDate()); // Normalize to midnight
            const currentDayDiv = document.getElementById("current-day");

            // Swahili names for days and months
            const swahiliDays = ["Jumapili", "Jumatatu", "Jumanne", "Jumatano", "Alhamisi", "Ijumaa", "Jumamosi"];
            const swahiliMonths = [
                "Januari", "Februari", "Machi", "Aprili", "Mei", "Juni", "Julai", "Agosti", "Septemba", "Oktoba", "Novemba", "Desemba"
            ];

            // Determine liturgical season
            let season = "Kipindi cha Kawaida";
            let seasonClass = "ordinary";

            // Advent: First Sunday of Advent (Nov 30, 2025) to Dec 24
            if (currentDate >= firstAdvent && currentDate < new Date(2025, 11, 25)) {
                season = "Majilio";
                seasonClass = "advent";
            }
            // Christmas: Dec 25 to Baptism of the Lord (Jan 12, 2026)
            else if (
                (currentDate >= new Date(2025, 11, 25) && currentDate <= new Date(2025, 11, 31)) ||
                (currentDate.getFullYear() === 2026 && currentDate <= new Date(2026, 0, 12))
            ) {
                season = "Krismasi";
                seasonClass = "christmas";
            }
            // Lent: Ash Wednesday to Holy Thursday (April 16, 2025)
            else if (currentDate >= ashWednesday && currentDate < new Date(2025, 3, 17)) {
                season = "Kwaresima";
                seasonClass = "lent";
            }
            // Easter: Easter Sunday to Pentecost
            else if (currentDate >= easterSunday && currentDate <= pentecost) {
                season = "Pasaka";
                seasonClass = "easter";
            }

            // Swahili date string
            const weekday = swahiliDays[currentDate.getDay()];
            const month = swahiliMonths[currentDate.getMonth()];
            const day = currentDate.getDate();
            const year = currentDate.getFullYear();
            const swahiliDate = `${weekday}, ${day} ${month} ${year}`;

            // Display the current day's information in Swahili
            currentDayDiv.innerHTML = `
                <h2 class="text-2xl font-semibold text-gray-800 mb-4">Leo: ${swahiliDate}</h2>
                <p class="text-lg"><strong>Kipindi:</strong> <span class="${seasonClass}">${season}</span></p>
            `;
        }

        // Function to schedule the next update at midnight
        function scheduleMidnightUpdate() {
            const now = new Date();
            const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const timeToMidnight = midnight - now;

            setTimeout(() => {
                displayCurrentDay();
                scheduleMidnightUpdate(); // Schedule the next update
            }, timeToMidnight);
        }

        // Initial display and schedule updates
        displayCurrentDay();
        scheduleMidnightUpdate();
    </script>
